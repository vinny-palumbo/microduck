[project]
name = "microduck-navigation"
version = "0.1.0"
description = "Guarded observations and bounded actions for the Microduck simulator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiortc>=1.14,<2",
    "aiohttp>=3.12,<4",
    "numpy>=2",
    "pillow>=11",
]

[project.scripts]
duck-nav = "duck_nav.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["duck_nav"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
